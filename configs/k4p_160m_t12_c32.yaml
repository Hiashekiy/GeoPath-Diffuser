# k4p 160 m (0.625 m/cell) + T=12 noise table + C=32 controls
#
# Data: data/geopath_v1_k4p (converted from data/160m-k4p-c32q64 by
# scripts/prepare_k4p_dataset.py).  The source bitmap is 256x256 over 160 m, so
# res_m = 0.625 and one scene unit = 80 m (default.yaml assumes 32 m).
#
# Every geometric constant below that lives in SCENE units is rescaled by
# 32/80 = 0.4 so it keeps its physical meaning:
#   corridor.region.safety_margin        0.02  -> 0.008   (0.64 m)
#   corridor.region.obstacle_window_half 0.35  -> 0.14    (11.2 m)
#   corridor.region.ellipse_axis_min     0.002 -> 0.0008
#   corridor.region.ellipse_axis_max     2.0   -> 0.30    (24 m)
#   clean_guidance.step_size             50    -> 20
#   final_projection.feasibility_tol_scene 1e-4 -> 4e-5
#
#   python scripts/train_dual_branch.py --config configs/k4p_160m_t12_c32.yaml \
#       --dataset real --real-split train --val-split val --batch-size 4 \
#       --epochs 100 --steps 0 --device cuda

dataset:
  res_m: 0.625                  # extent = res_m * grid = 160 m
  grid: 256
  extent_m: 160.0
  real_root: "data/geopath_v1_k4p"
  robot_radius_cells: 2
  min_geodesic_m: 40.0          # the labelled trajectories are 90 m long on median
  path_points: 128

trajectory:
  num_controls: 32              # == control_gt / curve_gt of the k4p labels
  degree: 3
  curve_points: 128

diffusion:
  num_controls: 32
  depth: 4                      # 12 -> 4 blocks (55.4M -> 18.8M params)
  train_diffusion_steps: 12     # the noise table this run trains on
  beta_schedule: "squaredcos_cap_v2"

sampling:
  steps: 12                     # full trained table at inference (12 forwards)
  geometry_forward: 1
  mid_forward_fraction: 0.5
  constraint_points: 256
  arc_length_lookup_points: 1024

corridor:
  region:
    safety_margin: 0.008
    obstacle_window_half: 0.14
    ellipse_axis_min: 0.0008
    ellipse_axis_max: 0.30

clean_guidance:
  step_size: 20.0

final_projection:
  feasibility_tol_scene: 4.0e-5

guidance:
  projection_radius: 2          # ~1 m at 0.625 m/cell

map_encoder:
  sdf_clip_m: 8.0               # must match the checkpoint's d_clip
